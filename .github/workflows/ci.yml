name: Build and Push Quasar App

on:
  push:
    branches: [production, staging]
  pull_request:
    branches: [production, staging]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          # Get branch name (staging or production)
          BRANCH=${GITHUB_REF#refs/heads/}
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

          # Get short commit SHA for rollback tags
          SHORT_SHA=${GITHUB_SHA::7}
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

          # Create lowercase image name
          IMAGE_NAME=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT

          echo "🌿 Branch: $BRANCH"
          echo "🔖 Commit SHA: $SHORT_SHA"
          echo "📦 Image: $IMAGE_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.branch }}
            ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.branch }}-${{ steps.meta.outputs.short_sha }}
            ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.branch }}-${{ github.run_number }}
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=IBF Quasar DevObs Application
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.version=${{ steps.meta.outputs.branch }}-${{ steps.meta.outputs.short_sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deployment summary
        run: |
          BRANCH=${{ steps.meta.outputs.branch }}
          SHORT_SHA=${{ steps.meta.outputs.short_sha }}
          IMAGE_BASE=${{ steps.meta.outputs.image_name }}

          echo "🎯 Deployment Summary:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🌿 Branch: $BRANCH"
          echo "🔖 Commit: $SHORT_SHA"
          echo "🚀 Auto-deploy: Your $BRANCH environment will update automatically!"

          echo "📦 Pushed Images:"
          echo "  📌 $IMAGE_BASE:$BRANCH (auto-deploy tag)"
          echo "  🔄 $IMAGE_BASE:$BRANCH-$SHORT_SHA (rollback tag)"
          echo "  📊 $IMAGE_BASE:$BRANCH-${{ github.run_number }} (tracking tag)"

          if [ "$BRANCH" = "staging" ]; then
            echo "🌐 URL: http://ibf-quasar-devobs.stg.localhost:8080/"
          elif [ "$BRANCH" = "production" ]; then
            echo "🌐 URL: http://ibf-quasar-devobs.prod.localhost:8080/"
          fi

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
