name: Build and Push Quasar App
on:
  push:
    branches: [production, staging]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract branch name and commit SHA
        id: extract
        run: |
          # Get branch name (staging or production)
          BRANCH=${GITHUB_REF#refs/heads/}
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

          # Get short commit SHA for rollback tags
          SHORT_SHA=${GITHUB_SHA::7}
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

          echo "🌿 Branch: $BRANCH"
          echo "🔖 Commit SHA: $SHORT_SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        id: build
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ steps.extract.outputs.branch }}
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ steps.extract.outputs.branch }}-${{ steps.extract.outputs.short_sha }}
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ steps.extract.outputs.branch }}-${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deployment Summary
        run: |
          BRANCH=${{ steps.extract.outputs.branch }}
          SHORT_SHA=${{ steps.extract.outputs.short_sha }}
          IMAGE_BASE=ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}

          echo "🎯 Deployment Summary:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🌿 Branch: $BRANCH"
          echo "🔖 Commit: $SHORT_SHA"
          echo "🚀 Auto-deploy: Your $BRANCH environment will update automatically!"

          echo "📦 Pushed Images:"
          echo "  📌 $IMAGE_BASE:$BRANCH (auto-deploy tag)"
          echo "  🔄 $IMAGE_BASE:$BRANCH-$SHORT_SHA (rollback tag)"
          echo "  📊 $IMAGE_BASE:$BRANCH-${{ github.run_number }} (tracking tag)"

          if [ "$BRANCH" = "staging" ]; then
            echo "🌐 URL: http://ibf-quasar-devobs.stg.localhost:8080/"
          elif [ "$BRANCH" = "production" ]; then
            echo "🌐 URL: http://ibf-quasar-devobs.prod.localhost:8080/"
          fi

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
